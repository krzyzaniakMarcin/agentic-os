[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-os"
version = "0.0.0"
description = "Local multi-agent coordination substrate"
requires-python = ">=3.12"
dependencies = [
    "asyncpg>=0.29",
    "mcp>=1.2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "python-dotenv>=1"]

[tool.setuptools]
packages = ["substrate", "agent"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

include:
  - langfuse/docker-compose.yml   # self-hosted Langfuse (self-contained; see that file)

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-agentic_os}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql/init:/docker-entrypoint-initdb.d   # schema auto-applied on first boot
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ${POSTGRES_DB:-agentic_os}"]
      interval: 3s
      timeout: 3s
      retries: 10

  kernel:
    build: .
    depends_on:
      db:
        condition: service_healthy      # depends_on alone != "ready" (arch §12)
    env_file: .env
    environment:                        # single source of truth, derived from POSTGRES_*
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-agentic_os}
    volumes:
      - ./:/app
      - ./config/claude:/root/.claude   # clean checked-in CLI config, NOT personal ~/.claude
    # -m form so /app (not /app/scripts) is on sys.path and the app packages import
    command: ["python", "-m", "kernel.orchestrator"]

volumes:
  pgdata: {}
